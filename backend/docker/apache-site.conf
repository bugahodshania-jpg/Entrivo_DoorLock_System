<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Only the API is public. Code, config, tests, debug tools and stored files are not.
    <DirectoryMatch "^/var/www/html/(config|controllers|docker|middleware|migrations|models|routes|services|storage|tests|tools|utils)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.|^(test_model|test_service)\.php$|^Dockerfile$">
        Require all denied
    </FilesMatch>
</VirtualHost>
